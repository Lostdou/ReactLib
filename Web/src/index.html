<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reaction Library — videos de X listos para pegar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Biblioteca de videos de reacción de X. Copiás el link, lo pegás en tu post y el video se adjunta con atribución al autor, sin subir nada ni citar.">
  <meta name="theme-color" content="#0b0e13">
  <!-- video.twimg.com responde 403 si le llega Referer, y el default del browser manda el origen -->
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/x-icon" href="icon.ico">
  <link rel="preconnect" href="https://pbs.twimg.com" crossorigin>
  <link rel="preconnect" href="https://video.twimg.com" crossorigin>
</head>
<body>
  <app-root></app-root>
</body>
</html>
