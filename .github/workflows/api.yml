name: API → MonsterASP

on:
  push:
    branches: [main]
    paths: ['API/**', '.github/workflows/api.yml']
  workflow_dispatch:

env:
  # prender solo para diagnosticar: en el plan gratuito estos logs se comen los 5 GB
  STDOUT_LOG: 'false'

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # un solo publish: en Release el csproj fija RuntimeIdentifier, y un restore previo sin RID
      # deja el assets file sin target para net10.0/win-x64
      - name: Publish
        run: dotnet publish API/src/ReactLib.Api/ReactLib.Api.csproj -c Release -o publish

      # los secretos se escriben recien en el artefacto: nunca existen en el repo ni en su historial
      - name: Generar appsettings.Production.json
        shell: pwsh
        env:
          DB_CONNECTION: ${{ secrets.RL_CONNECTION_STRING }}
          ADMIN_KEY: ${{ secrets.RL_ADMIN_KEY }}
          IP_HASH_SALT: ${{ secrets.RL_IP_HASH_SALT }}
        run: |
          $settings = @{
            ConnectionStrings = @{ Db = $env:DB_CONNECTION }
            Api               = @{ AdminKey = $env:ADMIN_KEY; IpHashSalt = $env:IP_HASH_SALT }
          }
          $settings | ConvertTo-Json -Depth 4 | Set-Content publish/appsettings.Production.json -Encoding utf8

      - name: Configurar stdout log
        if: env.STDOUT_LOG == 'true'
        shell: pwsh
        run: |
          [xml]$config = Get-Content publish/web.config
          $node = $config.configuration.location.'system.webServer'.aspNetCore
          $node.stdoutLogEnabled = 'true'
          $config.Save("$PWD/publish/web.config")
          Get-Content publish/web.config

      # msdeploy directo y no una action: el endpoint de MonsterASP escucha en el 8172 (WMSVC)
      # y las actions de web deploy arman la URL contra el puerto 80, que devuelve 404
      - name: Deploy
        shell: pwsh
        env:
          SITE: ${{ secrets.MONSTERASP_WEBSITE_NAME }}
          SERVER: ${{ secrets.MONSTERASP_SERVER }}
          DEPLOY_USER: ${{ secrets.MONSTERASP_USERNAME }}
          DEPLOY_PASS: ${{ secrets.MONSTERASP_PASSWORD }}
        run: |
          $msdeploy = 'C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe'
          $endpoint = "https://$($env:SERVER):8172/msdeploy.axd?site=$($env:SITE)"
          $dest = "contentPath=$($env:SITE),computerName=$endpoint,userName=$($env:DEPLOY_USER),password=$($env:DEPLOY_PASS),authType=Basic"

          # AppOffline primero: sin eso el ReactLib.Api.dll en uso bloquea la copia
          & $msdeploy '-verb:sync' "-source:contentPath=$PWD\publish" "-dest:$dest" `
            '-enableRule:AppOffline' '-allowUntrusted' '-retryAttempts:3'

          if ($LASTEXITCODE -ne 0) { throw "msdeploy terminó con código $LASTEXITCODE" }

      # si no levanta, traemos de vuelta el stdout log: es la unica forma de ver la excepcion real
      - name: Verificar y diagnosticar
        shell: pwsh
        env:
          SITE: ${{ secrets.MONSTERASP_WEBSITE_NAME }}
          SERVER: ${{ secrets.MONSTERASP_SERVER }}
          DEPLOY_USER: ${{ secrets.MONSTERASP_USERNAME }}
          DEPLOY_PASS: ${{ secrets.MONSTERASP_PASSWORD }}
        run: |
          Start-Sleep -Seconds 25
          $status = try { (Invoke-WebRequest 'https://reactlib.runasp.net/api/health' -TimeoutSec 60 -SkipHttpErrorCheck).StatusCode } catch { 0 }
          Write-Host "GET /api/health -> $status"
          if ($status -eq 200) { exit 0 }

          Start-Sleep -Seconds 15
          $msdeploy = 'C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe'
          $endpoint = "https://$($env:SERVER):8172/msdeploy.axd?site=$($env:SITE)"
          $src = "contentPath=$($env:SITE)/logs,computerName=$endpoint,userName=$($env:DEPLOY_USER),password=$($env:DEPLOY_PASS),authType=Basic"

          & $msdeploy '-verb:sync' "-source:$src" "-dest:contentPath=$PWD\remote-logs" '-allowUntrusted'

          Get-ChildItem -Recurse "$PWD/remote-logs" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.Name) ====="
            Get-Content $_.FullName -ErrorAction SilentlyContinue | Select-Object -Last 60
          }
          throw "la app no respondió 200 (status $status)"
