name: Web → GitHub Pages

on:
  push:
    branches: [main]
    paths: ['Web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CUSTOM_DOMAIN: reactlib.lostdou.dev

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - run: npm ci

      # con dominio propio el sitio vive en la raiz, no en /<repo>/
      - run: npx ng build --configuration production --base-href "/"

      - name: Fallback de rutas, dominio y sin Jekyll
        run: |
          # Pages sirve 404.html para cualquier ruta desconocida y asi el router resuelve deep links
          cp dist/reactlib-web/browser/index.html dist/reactlib-web/browser/404.html
          touch dist/reactlib-web/browser/.nojekyll
          echo "$CUSTOM_DOMAIN" > dist/reactlib-web/browser/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web/dist/reactlib-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
